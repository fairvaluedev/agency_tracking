openapi: 3.1.0
info:
  title: Agency Tracking Production API
  description: Production-grade, 100% verified OpenAPI 3.1.0 specification for the
    Agency Tracking recruitment and foreign placement platform running on Frappe.
  version: 2.0.0
  contact:
    name: API Operations Team
    email: api-support@example.local
servers:
- url: http://127.0.0.1:8000
  description: Local Development Server
tags:
- name: 01 - Authentication & Session
  description: Login, session status, and CSRF token bootstrap
- name: 02 - Applicants & Registration
  description: Candidate onboarding, biometric registration, passport MRZ OCR parsing,
    country bans
- name: 03 - CV Management
  description: CV generation, letterhead rendering, PDF download streaming
- name: 04 - Portal & Candidate Discovery
  description: Foreign agency candidate search, filtering, and candidate selection
- name: 05 - Placements & Logistics
  description: Contract parsing, Kuwait visa parsing, medical checkpoints, flight
    ticketing, departures
- name: 06 - Clearances & Embassies
  description: Corridor clearance steps (LMIS, Taeshir, Telesign), embassy submission,
    stamping, rejection
- name: 07 - Finance & Ledger
  description: Stage expenses/income, FX exchange rates, commission batch requests,
    invoices, settlement
- name: 08 - Bank Reconciliation
  description: Bank statement CSV upload, automated line matching, manual override
    reconciliation
- name: 09 - Complaints & Disputes
  description: Agency dispute logging, triage acknowledgement, resolution, free replacement
    requests
- name: 10 - Chat & Messages
  description: Real-time communication channels, agency-to-staff threads, direct messaging,
    attachments
- name: 11 - Notifications
  description: User notification inbox, watchdog alert streaming, mark as read
- name: 12 - Contractors & Foreign Agencies
  description: Foreign agency contractor accounts, quota tracking, agency listing
- name: 13 - Reports & Analytics
  description: Executive operations summary, recruitment funnel, aging reports, Excel
    commission export
- name: 14 - API Documentation
  description: OpenAPI / Swagger live schema discovery
- name: 15 - Core RPC & File Storage
  description: Frappe core file upload, attachment management, and downloads
paths:
  /api/method/agency_tracking.auth_api.get_csrf_token:
    post:
      tags:
      - 01 - Authentication & Session
      summary: Get Csrf Token
      description: 'get_csrf_token


        **Authorized Roles:** Kuwait Embassy, Manager, Kuwait Telesign, Saudi LMIS,
        Saudi Taeshir, System Manager, Clearance Officer, Saudi Embassy, Registrar,
        Complaint Manager, Ticketer, Finance Manager, Kuwait LMIS, Contract Parser,
        Guest, Administrator, Communication Manager, Admin, Foreign Agency'
      operationId: get_csrf_token
      security:
      - frappeSessionCookie: []
        frappeCsrfToken: []
      - frappeApiToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
            example: {}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Permission Denied / Insufficient Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/method/agency_tracking.auth_api.get_current_user:
    post:
      tags:
      - 01 - Authentication & Session
      summary: Get Current User
      description: "allow_guest=True deliberately, with an explicit Guest check inside\
        \ \u2014 not a security\nrelaxation. Without it, an anonymous SPA's \"is there\
        \ already a session?\" bootstrap check\n(needed so a page refresh doesn't\
        \ force a fresh login) hits Frappe's own whitelist guard\nbefore this function's\
        \ body ever runs, producing a 403 on every single cold page load.\nReturning\
        \ None for Guest instead of throwing means that bootstrap check is a normal\
        \ 200\nresponse either way \u2014 \"nobody's logged in\" is an expected outcome,\
        \ not an error.\n\n**Authorized Roles:** Kuwait Embassy, Manager, Kuwait Telesign,\
        \ Ticketer, Finance Manager, Saudi LMIS, Saudi Taeshir, Kuwait LMIS, Contract\
        \ Parser, Guest, System Manager, Administrator, Clearance Officer, Saudi Embassy,\
        \ Registrar, Communication Manager, Admin, Complaint Manager, Foreign Agency"
      operationId: get_current_user
      security:
      - frappeSessionCookie: []
        frappeCsrfToken: []
      - frappeApiToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
            example: {}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Permission Denied / Insufficient Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/method/agency_tracking.applicant_api.cancel_applicant:
    post:
      tags:
      - 02 - Applicants & Registration
      summary: Cancel Applicant
      description: 'Global ''Cancelled'' escape hatch (2026-08-29 lifecycle spec):
        only from Registered/CV

        Generated (never Draft -- nothing committed yet to cancel). If there''s an
        active Placement,

        freeze it and its Clearance Steps first (marked Cancelled, left as permanent
        history) and

        clear active_placement -- all before the Applicant itself moves to Cancelled,
        so

        Placement.validate()''s own checks (still-matching active_placement/status)
        pass cleanly.

        Landing on Cancelled never bumps cycle_number by itself; only a later restart
        does.


        **Authorized Roles:** Manager, System Manager, Registrar, Administrator, Admin'
      operationId: cancel_applicant
      security:
      - frappeSessionCookie: []
        frappeCsrfToken: []
      - frappeApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicant_name:
                  type: string
                  description: 'Parameter: applicant_name'
                reason:
                  type: string
                  description: 'Parameter: reason'
              required:
              - applicant_name
              - reason
            example:
              applicant_name: '{{applicant_name}}'
              reason: Verified operational processing.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Permission Denied / Insufficient Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
