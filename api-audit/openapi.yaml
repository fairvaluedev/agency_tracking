components:
  securitySchemes:
    frappeSessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: Frappe user session cookie established after successful login.
    frappeCsrfToken:
      type: apiKey
      in: header
      name: X-Frappe-CSRF-Token
      description: Frappe anti-CSRF token required for state-changing HTTP methods.
    frappeApiToken:
      type: http
      scheme: bearer
      bearerFormat: token <api_key>:<api_secret>
      description: Standard Frappe Token authentication.
  schemas:
    StandardSuccessResponse:
      type: object
      properties:
        message:
          type: object
          description: Returned document payload or response message.
    StandardErrorResponse:
      type: object
      properties:
        exception:
          type: string
          example: 'frappe.exceptions.ValidationError: Invalid parameter.'
        exc_type:
          type: string
          example: ValidationError
        _server_messages:
          type: string
          example: '["{\"message\": \"Operation failed\"}"]'
    Applicant:
      type: object
      properties:
        name:
          type: string
          example: APP-2026-00001
        first_name:
          type: string
          example: Fatima
        last_name:
          type: string
          example: Ahmed
        passport_number:
          type: string
          example: EP9876543
        destination_country:
          type: string
          enum:
          - Saudi Arabia
          - Kuwait
          example: Saudi Arabia
        status:
          type: string
          enum:
          - Draft
          - Registered
          - CV Generated
          - Cancelled
          example: Registered
        entry_track:
          type: string
          enum:
          - Standard
          - Muayena
          example: Standard
    Placement:
      type: object
      properties:
        name:
          type: string
          example: PLC-2026-00001
        applicant:
          type: string
          example: APP-2026-00001
        contractor:
          type: string
          example: Al-Riyadh Manpower Services
        status:
          type: string
          enum:
          - Selected
          - Processing
          - Stamped
          - Ticketed
          - Departed
          - Cancelled
          example: Processing
        destination_country:
          type: string
          example: Saudi Arabia
