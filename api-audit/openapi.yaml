        \ (Manager Override, e.g. approving a free replacement outside the normal\n\
        3-month window in an exceptional case): overriding a gate is a Manager-level\
        \ power\nthroughout this build (transition() itself enforces Manager/Admin\
        \ for any override), so\nthe permission check here widens to include plain\
        \ Manager specifically for an override\nattempt \u2014 an ordinary (non-override)\
        \ resolution move stays Complaint Manager/Admin only,\nper Part A.5's literal\
        \ statement.\n\n**Authorized Roles:** Complaint Manager, Manager, System Manager,\
        \ Administrator, Admin"
