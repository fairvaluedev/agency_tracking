  /api/method/agency_tracking.applicant_api.list_applicants:
    post:
      tags:
      - 02 - Applicants & Registration
      summary: List Applicants
      description: 'backend-issues #02: the whitelisted list surface Applicant never
        had -- callers used to

        fall back to raw /api/resource/Applicant, which only Registrar/Manager/Admin/System
        Manager

        could read (Applicant''s doctype-level permissions), 403ing every other role
        that legitimately

        needs to resolve an applicant name reference (Finance Manager, Clearance Officer,
        Complaint

        Manager, Communication Manager, the six country+step roles -- all granted
        read-only access on

        the doctype itself, see applicant.json). frappe.get_list enforces those permissions
        the same

        way it would for any other doctype; no separate role check needed here.


        **Authorized Roles:** Kuwait Embassy, Manager, Kuwait Telesign, Ticketer,
        Finance Manager, Saudi LMIS, Saudi Taeshir, Kuwait LMIS, Contract Parser,
        System Manager, Administrator, Clearance Officer, Saudi Embassy, Registrar,
        Communication Manager, Admin, Complaint Manager'
      operationId: list_applicants
      security:
