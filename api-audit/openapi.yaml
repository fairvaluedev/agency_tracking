  /api/method/agency_tracking.cv_api.generate_cv:
    post:
      tags:
      - 03 - CV Management
      summary: Generate Cv
      description: 'Part A.2 Stage 3 / Part I Step 2: create + submit a CV Record
        for a Standard-track

