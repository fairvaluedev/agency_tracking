; Supervisord process management for headless agency_tracking Frappe backend on Railway
;
; Processes running in single container:
; 1. Redis Server (local cache, queue, socketio)
; 2. Web Process (Gunicorn running frappe.app:application on $PORT)
; 3. Worker Process (bench worker executing background RQ jobs)
; 4. Scheduler Process (bench schedule executing watchdogs and cron hooks)

[supervisord]
nodaemon=true
user=frappe
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
command=redis-server --daemonize no --port 6379 --save ""
directory=/home/frappe/bench
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/home/frappe/bench/env/bin/gunicorn --bind 0.0.0.0:%(ENV_PORT)s --workers %(ENV_GUNICORN_WORKERS)s --timeout 120 frappe.app:application
directory=/home/frappe/bench
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/bench worker
directory=/home/frappe/bench
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:schedule]
command=/usr/local/bin/bench schedule
directory=/home/frappe/bench
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
