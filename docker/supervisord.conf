; Runs everything a single headless Frappe instance needs inside one Railway container:
; local Redis (cache+queue+socketio, all on one instance -- fine at this scale), the web
; process, one background worker, and the scheduler (which is what actually fires
; agency_tracking's watchdogs: wakala_reminder_watchdog, taeshir_injaz_reminder_watchdog,
; medical_expiry_watchdog, fetch_daily_fx_rates, etc. -- see hooks.py's scheduler_events).
; socketio is intentionally NOT run -- this backend is headless/API-only, no Desk realtime
; UI depends on it.

[supervisord]
nodaemon=true
user=frappe
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid

[program:redis]
; --save "" disables RDB snapshotting -- this instance only ever holds cache/queue/socketio
; pub-sub state, nothing that needs to survive a restart, so there's no dump.rdb write-
; permission concern to worry about either (it would otherwise default to writing into
; supervisord's own cwd, which the frappe user doesn't necessarily own).
command=redis-server --daemonize no --port 6379 --save ""
directory=/home/frappe/bench
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.error.log

[program:web]
; No --chdir here: frappe resolves `sites/` relative to the process's cwd, so gunicorn must
; run from the bench root itself (set via `directory` below), never from inside sites/.
command=/home/frappe/bench/env/bin/gunicorn
    --bind 0.0.0.0:%(ENV_PORT)s
    --workers %(ENV_GUNICORN_WORKERS)s
    --timeout 120
    frappe.app:application
directory=/home/frappe/bench
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/web.log
stderr_logfile=/var/log/supervisor/web.error.log

[program:worker]
; No --queue filter -- consumes all of them (low/default/high). agency_tracking's own
; watchdogs.py/notification_engine.py enqueue via plain frappe.enqueue() without pinning a
; specific queue, so there's no reason to split workers by queue at this scale.
command=/home/frappe/bench/env/bin/bench worker
directory=/home/frappe/bench
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/worker.log
stderr_logfile=/var/log/supervisor/worker.error.log

[program:schedule]
command=/home/frappe/bench/env/bin/bench schedule
directory=/home/frappe/bench
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/schedule.log
stderr_logfile=/var/log/supervisor/schedule.error.log
