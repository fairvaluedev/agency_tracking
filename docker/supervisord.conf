; Runs everything a single headless Frappe instance needs inside one Railway container:
; local Redis (cache+queue+socketio, all on one instance), the web
; process, one background worker, and the scheduler (which is what actually fires
; agency_tracking's watchdogs: wakala_reminder_watchdog, taeshir_injaz_reminder_watchdog,
; medical_expiry_watchdog, fetch_daily_fx_rates, etc. -- see hooks.py's scheduler_events).
; socketio is intentionally NOT run -- this backend is headless/API-only.

[supervisord]
nodaemon=true
user=frappe
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
command=redis-server --daemonize no --port 6379 --save ""
directory=/home/frappe/bench
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/home/frappe/bench/env/bin/gunicorn --bind 0.0.0.0:%(ENV_PORT)s --workers %(ENV_GUNICORN_WORKERS)s --timeout 120 frappe.app:application
directory=/home/frappe/bench
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/home/frappe/bench/env/bin/bench worker
directory=/home/frappe/bench
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:schedule]
command=/home/frappe/bench/env/bin/bench schedule
directory=/home/frappe/bench
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

